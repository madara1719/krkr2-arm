name: build-linux-arm64

on:
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg-root
    steps:
      - name: Verificar arquitectura del runner
        run: |
          echo "uname -m: $(uname -m)"
          echo "uname -a: $(uname -a)"

      - name: Checkout (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Liberar espacio en disco
        run: |
          if [ -d /opt/hostedtoolcache ]; then
            sudo rm -rf /opt/hostedtoolcache
            echo "Borrado /opt/hostedtoolcache"
          fi

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            perl build-essential ninja-build bison flex python3 \
            nasm yasm pkg-config curl zip unzip tar git binutils \
            autoconf autoconf-archive automake libtool libtool-bin libltdl-dev m4 \
            libx11-dev libxft-dev libxext-dev libxxf86vm-dev libxmu-dev \
            libglu1-mesa-dev libgl2ps-dev libxi-dev libzip-dev libpng-dev \
            libcurl4-gnutls-dev libfontconfig1-dev libsqlite3-dev libglew-dev \
            libssl-dev libgtk-3-dev \
            libxrender-dev libxrandr-dev libxfixes-dev libxtst-dev libxcb1-dev \
            libxau-dev libxdmcp-dev libdbus-1-dev libsystemd-dev libcap-dev \
            libasound2-dev libatspi2.0-dev libmount-dev libblkid-dev \
            libselinux1-dev libepoxy-dev

      - name: Instalar CMake >= 3.31.1
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.1"

      - name: Configurar vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: build-linux-arm64-patched

      - name: Parchear UB de tTJSVariantString (Issue #48)
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Parcheando null pointer dereferences ==="

          HEADER="cpp/core/tjs2/tjsString.h"
          SOURCE="cpp/core/tjs2/tjsVariantString.cpp"

          # 1. Parche principal: tjsString.h - GetLen() no verifica Ptr antes de llamar
          #    ANTES:  tjs_int GetLen() const { return Ptr->GetLength(); }
          #    DESPUES: tjs_int GetLen() const { return Ptr ? Ptr->GetLength() : 0; }
          sed -i 's|return Ptr->GetLength();|return Ptr ? Ptr->GetLength() : 0;|g' "$HEADER"

          # 2. Parche tjsString.h - GetLastChar() ya verifica Ptr, pero GetLength()
          #    se llama dentro via Ptr-> directamente, asegurar consistencia
          #    La linea: return p[Ptr->GetLength() - 1];
          #    Ya esta protegida por el if(!Ptr) anterior, OK

          # 3. Parche tjsVariantString.cpp - reemplazar if(!this) por checks seguros
          #    en operator const tjs_char*
          sed -i 's|return (!this) ? (nullptr) : (LongString ? LongString : ShortString);|return (LongString ? LongString : ShortString);|g' "$SOURCE"

          # Verificar que los parches se aplicaron
          echo "--- tjsString.h GetLen ---"
          grep -n "GetLen" "$HEADER" | head -5
          echo "--- tjsVariantString.cpp GetLength ---"
          grep -n "GetLength" "$SOURCE" | head -5
          echo "--- tjsVariantString.cpp operator const ---"
          grep -n "LongString ? LongString" "$SOURCE" | head -5

          echo "=== Parches aplicados ==="

      - name: Compilar krkr2 (Linux ARM64, Release parcheado)
        shell: bash
        run: |
          set -euxo pipefail

          # Ahora podemos compilar en Release porque el UB esta parcheado
          cmake --preset="Linux Release Config" \
            -DENABLE_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DCMAKE_CXX_FLAGS="-fno-delete-null-pointer-checks" \
            -DCMAKE_C_FLAGS="-fno-delete-null-pointer-checks"

          # Reemplazar los binarios x86_64 de FMOD por los ARM64 reales
          FMOD_DEST="out/linux/release/vcpkg_installed/arm64-linux/share/cocos2dx/linux-specific/fmod/prebuilt/64-bit"
          if [ -d "$FMOD_DEST" ]; then
            cp ci-assets/fmod-arm64/libfmod*.so* "$FMOD_DEST/"
            echo "FMOD arm64 copiado a $FMOD_DEST"
            ls -lh "$FMOD_DEST/"
            file "$FMOD_DEST/libfmod.so"
          else
            echo "ERROR: no existe $FMOD_DEST — revisa la ruta"
            find out -iname 'libfmod*.so' || true
            exit 1
          fi

          # Compilar en Release (seguro gracias al parche)
          cmake --build --preset="Linux Release Build"

          # Copiar TODAS las librerías FMOD junto al binario
          find out/linux/release/ -name 'libfmod*.so*' -exec cp {} out/linux/release/bin/krkr2/ \;

          echo "Archivos FMOD en el directorio final:"
          ls -lh out/linux/release/bin/krkr2/libfmod* || true

      - name: Debug - listar contenido de out/
        if: always()
        run: |
          echo "== pwd =="; pwd
          find out -maxdepth 6 2>/dev/null || echo "out/ no existe"

      - name: Subir binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: krkr2-linux-arm64
          path: out/linux/release/bin/krkr2/**
          if-no-files-found: warn
